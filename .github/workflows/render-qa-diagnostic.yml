name: Diagnóstico GET de Render QA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-render:
    runs-on: ubuntu-latest
    environment: qa
    timeout-minutes: 10
    steps:
      - name: Comparar consultas de despliegues sin disparar hooks
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_API_QA: ${{ vars.RENDER_SERVICE_API_QA }}
          RENDER_SERVICE_FRONT_QA: ${{ vars.RENDER_SERVICE_FRONT_QA }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timedelta, timezone
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          required = ("RENDER_API_KEY", "RENDER_SERVICE_API_QA", "RENDER_SERVICE_FRONT_QA")
          for name in required:
              if not os.environ.get(name, "").strip():
                  raise SystemExit(f"Falta la variable obligatoria: {name}")

          token = os.environ["RENDER_API_KEY"]
          services = {
              "backend": os.environ["RENDER_SERVICE_API_QA"],
              "frontend": os.environ["RENDER_SERVICE_FRONT_QA"],
          }
          for label, service in services.items():
              if not re.fullmatch(r"srv-[A-Za-z0-9]+", service):
                  raise SystemExit(f"{label}: formato de ID inválido; valor omitido")

          class NoRedirects(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  # Do not forward the API key to another destination.
                  return None

          opener = build_opener(NoRedirects())
          cutoff = datetime.now(timezone.utc) - timedelta(seconds=5)
          variants = {
              "A": {"limit": 100},
              "B": {"limit": 100, "createdAfter": cutoff.strftime("%Y-%m-%dT%H:%M:%SZ")},
              "C": {"limit": 100, "createdAfter": cutoff.isoformat()},
          }

          def safe_message(body):
              try:
                  payload = json.loads(body)
              except (ValueError, UnicodeError):
                  return "Respuesta sin mensaje JSON; cuerpo omitido"
              message = payload.get("message") if isinstance(payload, dict) else None
              if not isinstance(message, str):
                  return "Respuesta sin campo message; cuerpo omitido"
              for value in (token, *services.values()):
                  message = message.replace(value, "[REDACTED]")
              message = re.sub(r"https?://[^\s\"'<>]+", "[URL OMITIDA]", message, flags=re.I)
              message = re.sub(r"Bearer\s+\S+", "Bearer [REDACTED]", message, flags=re.I)
              message = re.sub(r"(?i)(key|token|password|secret)\s*[:=]\s*[^\s,;]+",
                               r"\1=[REDACTED]", message)
              # Escape newlines and control characters to keep error text on one line.
              return json.dumps(message[:300], ensure_ascii=True)

          for label, service in services.items():
              for variant, params in variants.items():
                  url = f"https://api.render.com/v1/services/{service}/deploys?{urlencode(params)}"
                  req = Request(url, method="GET", headers={
                      "Accept": "application/json",
                      "Authorization": f"Bearer {token}",
                  })
                  try:
                      with opener.open(req, timeout=60) as response:
                          status = response.status
                          body = response.read(2_000_000)
                  except HTTPError as error:
                      status = error.code
                      body = error.read(8192)
                  except (URLError, TimeoutError, OSError):
                      print(f"{label} / {variant}: error de conexión o timeout; detalle omitido", flush=True)
                      continue
                  if status == 200:
                      try:
                          payload = json.loads(body)
                          detail = f"resultados={len(payload)}" if isinstance(payload, list) else "estructura inesperada; cuerpo omitido"
                      except (ValueError, UnicodeError):
                          detail = "JSON inválido; cuerpo omitido"
                  else:
                      detail = f"message={safe_message(body)}"
                  print(f"{label} / {variant}: HTTP {status}; {detail}", flush=True)

          print("Diagnóstico finalizado: sólo GET; ningún hook fue invocado.", flush=True)
          PY
