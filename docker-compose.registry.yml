services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: listafacil
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d listafacil"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/jazminmorenasanchez/listafacil-backend:v0.1.0
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/listafacil?schema=public
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8080:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/jazminmorenasanchez/listafacil-frontend:v0.1.0
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data: