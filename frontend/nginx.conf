server {
    listen ${PORT};

    # SPA: estáticos, con fallback a index.html
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Plantilla procesada por el entrypoint oficial al iniciar el contenedor.
    # BACKEND_URL debe ser el origen del backend, sin ruta ni barra final.
    resolver ${DNS_RESOLVER} valid=10s ipv6=off;
    set $backend_api ${BACKEND_URL};

    location /api/ {
        proxy_pass $backend_api$request_uri;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization $http_authorization;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
    }
}
